services:
  interfaces:
    build:
      context: ./uis
    ports:
      - "3000:3000"
      - "3001:3001"
    volumes:
      - ./uis/website:/app/uis/website
      - ./uis/backoffice:/app/uis/backoffice
      - /app/uis/website/node_modules
      - /app/uis/backoffice/node_modules
      # backoffice importa packages/data-utils (Hito 2) por ruta relativa fija — ver
      # .agents/rules/monorepo-imports.md. Solo lectura: esa app está congelada.
      - ./packages:/app/packages:ro
    env_file:
      - .env
    networks:
      - brasaland-net

  api:
    build:
      context: .
      dockerfile: services/Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./services/api:/app/services/api
      - ./services/telemetry:/app/services/telemetry
      - ./services/reporting:/app/services/reporting
      - ./data/pipelines:/app/data/pipelines
      - ./data/process:/app/data/process
      - ./data/eval:/app/data/eval
    env_file:
      - .env
    networks:
      - brasaland-net

networks:
  brasaland-net:
    driver: bridge
