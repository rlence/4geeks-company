services:
  interfaces:
    build:
      context: ./uis
    ports:
      - "3000:3000"
      - "3001:3001"
    volumes:
      - ./uis/website:/app/uis/website
      - ./uis/backoffice:/app/uis/backoffice
      - /app/uis/website/node_modules
      - /app/uis/backoffice/node_modules
      # backoffice importa packages/data-utils (Hito 2) por ruta relativa fija — ver
      # .agents/rules/monorepo-imports.md. Solo lectura: esa app está congelada.
      - ./packages:/app/packages:ro
    env_file:
      - .env
    networks:
      - brasaland-net

  mcp:
    build:
      context: .
      dockerfile: services/Dockerfile
    command: ["python", "-m", "mcps.brasaland_company"]
    ports:
      - "8010:8010"
    depends_on:
      - api
    volumes:
      - ./mcps:/app/mcps
      - ./services/api:/app/services/api
    env_file:
      - .env
    environment:
      COMPANY_API_URL: http://api:8000
      MCP_PORT: "8010"
    networks:
      - brasaland-net

  qdrant:
    image: qdrant/qdrant
    ports:
      - "6333:6333"
    # Primer servicio con estado del compose: sin este volumen, la colección
    # brasaland_knowledge se pierde en cada `docker compose down` y habría
    # que re-ejecutar setup() (ver context/plans/hito7.md, Fase 0).
    volumes:
      - qdrant-storage:/qdrant/storage
    networks:
      - brasaland-net

  api:
    build:
      context: .
      dockerfile: services/Dockerfile
    ports:
      - "8000:8000"
    depends_on:
      - qdrant
    volumes:
      - ./services/api:/app/services/api
      - ./services/telemetry:/app/services/telemetry
      - ./services/reporting:/app/services/reporting
      - ./data/pipelines:/app/data/pipelines
      - ./data/process:/app/data/process
      - ./data/eval:/app/data/eval
      - ./docs/company-knowledge-base:/app/docs/company-knowledge-base
    env_file:
      - .env
    environment:
      MCP_URL: http://mcp:8010/mcp
    networks:
      - brasaland-net

networks:
  brasaland-net:
    driver: bridge

volumes:
  qdrant-storage:
