[project]
name = "api"
version = "0.1.0"
description = "Directorio de Proveedores — API de Brasaland (FastAPI + TinyDB + Pydantic)"
requires-python = ">=3.13"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "tinydb",
    "pydantic",
]

[project.scripts]
seed = "seed:main"

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["main.py", "models.py", "database.py", "seed.py", "routes"]
