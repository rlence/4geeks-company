[project]
name = "api"
version = "0.1.0"
description = "Directorio de Proveedores — API de Brasaland (FastAPI + TinyDB + Pydantic)"
requires-python = ">=3.13"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "tinydb",
    "pydantic",
    "bcrypt>=5.0.0",
    "pyjwt>=2.13.0",
    "httpx>=0.28.1",
    "python-dotenv>=1.2.2",
]

[project.scripts]
seed = "seed:main"

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "freezegun>=1.5.5",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]

[tool.hatch.build.targets.wheel]
only-include = [
    "main.py",
    "models.py",
    "database.py",
    "seed.py",
    "config.py",
    "auth.py",
    "mail.py",
    "routes",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.coverage.run]
source = ["auth", "routes", "config", "database", "models"]
