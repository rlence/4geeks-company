name: Agent guardrails
on:
  pull_request:
  push:
    branches: [main, feature/agent-guardrails]
permissions:
  contents: read
jobs:
  deterministic-harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.2'
          python-version: '3.13'
      - run: uv sync --project services/api --frozen
      - name: Guardrails and agent regression (no provider credentials)
        run: >-
          uv run --project services/api python -m pytest
          services/api/tests/test_agent_guardrails.py
          services/api/tests/test_agent_guardrails_memory.py
          services/api/tests/test_agent.py
          services/api/tests/test_agent_memory.py
          services/api/tests/test_mcp_agent_client.py
          tests/pipelines/test_agent_guardrail_summary.py
          tests/pipelines/test_support_agent.py
          tests/pipelines/test_agent_routing.py
          tests/pipelines/test_agent_tools.py
          tests/pipelines/test_agent_evals.py
          tests/pipelines/test_agent_tools_evals.py
          tests/pipelines/test_rag.py -q
      - run: uv build --project services/api
